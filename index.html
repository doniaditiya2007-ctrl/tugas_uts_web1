<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Toko Buku Online</title><link rel="stylesheet" href="css/style.css">
  <!-- CSS INTERNAL: aturan khusus pada halaman login -->
  <style>.login-card .login-mark{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;background:#eaf2fb;color:#183b67;display:grid;place-items:center;font-size:28px}.login-card button[type=submit]{width:100%;margin-top:14px}</style>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-mark">📚</div>
      <h1>Toko Buku Online</h1>
      <p class="subtitle">Silakan masuk menggunakan akun yang tersedia.</p>
      <form id="formLogin">
        <label for="email">Email</label><input type="email" id="email" placeholder="nama@email.com" required>
        <label for="password">Password</label><input type="password" id="password" placeholder="Masukkan password" required>
        <button type="submit">Login</button>
      </form>
      <div class="link-row">
        <button type="button" class="text-button" id="btnLupa">Lupa Password?</button>
        <button type="button" class="text-button" id="btnDaftar">Daftar</button>
      </div>
      <p class="small muted" style="text-align:center;margin-top:22px">UTS Pemrograman Web 1 · Aplikasi Front-End</p>
    </section>
  </main>
  <dialog class="modal" id="modalLupa">
    <h2>Lupa Password</h2><p>Untuk simulasi UTS ini, silakan hubungi admin toko untuk bantuan reset password.</p>
    <div class="close-row"><button type="button" class="btn-light" data-close="modalLupa">Tutup</button></div>
  </dialog>
  <dialog class="modal" id="modalDaftar">
    <h2>Daftar Akun</h2><p class="muted small">Buat akun simulasi baru. Data disimpan di browser ini.</p>
    <form id="formDaftar">
      <label for="namaDaftar">Nama lengkap</label><input id="namaDaftar" required>
      <label for="emailDaftar">Email</label><input type="email" id="emailDaftar" required>
      <label for="passwordDaftar">Password</label><input type="password" id="passwordDaftar" minlength="4" required>
      <div class="form-actions"><button type="submit">Buat Akun</button><button type="button" class="btn-light" data-close="modalDaftar">Batal</button></div>
    </form>
  </dialog>
  <script src="js/data.js"></script><script src="js/app.js"></script>
</body></html>
